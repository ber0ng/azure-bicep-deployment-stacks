name: destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to tear down
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: Type the environment name again to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: ${{ inputs.environment == inputs.confirm }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # deleteAll removes every resource the stack manages, including the resource group.
      - name: Delete deployment stack
        run: |
          az stack sub delete \
            --name "stack-stackdemo-${{ inputs.environment }}" \
            --action-on-unmanage deleteAll \
            --yes \
            --only-show-errors

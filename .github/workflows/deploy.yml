name: deploy

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/**", "bicepconfig.json"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/_stack.yml
    with:
      environment: dev
      apply: true
    secrets: inherit

  # The "prod" GitHub environment has a required reviewer, so this waits for approval.
  prod:
    needs: dev
    uses: ./.github/workflows/_stack.yml
    with:
      environment: prod
      apply: true
    secrets: inherit
